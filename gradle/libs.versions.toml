# Catalogo de versiones: el unico sitio donde se escribe un numero de version.
#
# Regla del proyecto: solo versiones estables, verificadas contra el repositorio
# Maven (maven-metadata.xml), nunca contra un blog ni contra la documentacion.

[versions]
kotlin = "2.4.20"
agp = "9.4.0"
androidCompileSdk = "37"
androidMinSdk = "24"
androidTargetSdk = "37"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
lifecycle = "2.11.0"
kermit = "2.2.0"
turbine = "1.2.1"
paging = "3.5.1"
coil = "3.6.2"
navigation3 = "1.1.7"
room = "3.0.3"
sqlite = "2.7.1"
datastore = "1.2.1"
okio = "3.18.2"
datetime = "0.8.0"
work = "2.11.2"
ksp = "2.3.12"
koin = "4.2.2"
ktor = "3.5.2"
serialization = "1.11.0"
coroutines = "1.11.0"
nativeCoroutines = "1.0.6"

[libraries]
