# El SDK con el que corren los tests.
#
# No es el `compileSdk` de la app (37) por un motivo concreto: Robolectric exige
# Java 21 para las imagenes de SDK 36 y superiores, y el proyecto usa el JDK 17
# que instalamos al principio. El mensaje es claro cuando ocurre:
#
#   Failed to create a Robolectric sandbox: Android SDK 37 requires Java 21
#
# 35 es el mas alto que funciona con Java 17. La consecuencia hay que tenerla
# presente: estos tests no ven el comportamiento nuevo de Android 36 ni 37.
sdk=35

# Robolectric arranca la Application de verdad, y la nuestra arranca Koin. Sin
# esta linea, el segundo test falla con KoinApplicationAlreadyStartedException.
application=com.sebastiannarvaez.pokedex.android.TestApp

# El idioma con el que corren los tests.
#
# Sin esta linea, Robolectric usa el del sistema —en un runner de CI, ingles— y
# los tests que buscan «Entrar» encuentran «Sign in». No es que los tests esten
# mal: es que no decian en que idioma miraban.
#
# Se fija el idioma del proyecto. Si un dia hubiera que comprobar la traduccion,
# se hace con `@Config(qualifiers = "en")` en ese test concreto.
qualifiers=es
